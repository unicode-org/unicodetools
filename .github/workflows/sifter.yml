# Runs the sifter, checking for changes to UCA files.

name: Sifter

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  sift:
    runs-on: windows-latest
    steps:
    - name: Checkout source files
      uses: actions/checkout@v7
    - name: Run the sifter and check for changes
      shell: pwsh
      run: |
        Set-Location c\uca\sifter
        .\make_uca_files.ps1
